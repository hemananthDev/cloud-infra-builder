---
- name: Configure remote EC2 instance for Jenkins-based automation
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required system packages
      apt:
        name:
          - git
          - curl
          - unzip
          - python3
          - python3-pip
          - openjdk-11-jdk
        state: present

    - name: Install pip packages for Ansible and AWS CLI usage
      pip:
        name:
          - boto3
          - botocore

    - name: Add Jenkins repository key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
        state: present

    - name: Add Jenkins repository
      apt_repository:
        repo: deb https://pkg.jenkins.io/debian-stable binary/
        state: present

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Ensure Jenkins home directory exists
      file:
        path: /var/lib/jenkins
        state: directory
        owner: jenkins
        group: jenkins
        recurse: yes

    - name: Reload systemd (full re-exec)
      command: systemctl daemon-reexec

    - name: Reload systemd (lightweight reload)
      command: systemctl daemon-reload

    - name: Wait for Jenkins package to settle before starting
      wait_for:
        path: /etc/init.d/jenkins
        state: present
        timeout: 30

    - name: Enable and start Jenkins service
      systemd:
        name: jenkins
        enabled: yes
        state: started
